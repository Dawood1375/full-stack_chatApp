apiVersion: v1
kind: Secret
metadata:
  name: chatapp-secret
  namespace: chat-app
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: root
  MONGO_INITDB_ROOT_PASSWORD: CHANGE_ME
  JWT_SECRET: CHANGE_ME
  MONGODB_URI: "mongodb://root:CHANGE_ME@mongo:27017/chatApp?authSource=admin"
  # Optional, for image upload:
  # CLOUDINARY_CLOUD_NAME: CHANGE_ME
  # CLOUDINARY_API_KEY: CHANGE_ME
  # CLOUDINARY_API_SECRET: CHANGE_ME
